spring:
application:
name: etrade-demand-service

datasource:
url: jdbc:postgresql://localhost:5434/etrade_demand_db
username: etrade_user
password: etrade_pass
driver-class-name: org.postgresql.Driver

jpa:
hibernate:
ddl-auto: validate
show-sql: false
properties:
hibernate:
format_sql: true

flyway:
enabled: true
baseline-on-migrate: true
locations: classpath:db/migration

security:
oauth2:
resourceserver:
jwt:
issuer-uri: http://localhost:8180/realms/etrade
jwk-set-uri: http://localhost:8180/realms/etrade/protocol/openid-connect/certs

server:
port: 8082

# URLs des autres services (communication inter-services)
services:
document-service-url: http://localhost:8083
notification-service-url: http://localhost:8084

management:
endpoints:
web:
exposure:
include: health,info
endpoint:
health:
show-details: always

springdoc:
api-docs:
path: /api-docs
swagger-ui:
path: /swagger-ui.html

logging:
level:
ma.portnet: DEBUG
org.springframework.security: INFO