services:

  # ════════════════════════════════════════════════════════════
  # BASES DE DONNÉES
  # ════════════════════════════════════════════════════════════

  postgres-auth:
    image: postgres:15-alpine
    container_name: etrade-pg-auth
    environment:
      POSTGRES_DB:       etrade_auth_db
      POSTGRES_USER:     etrade_user
      POSTGRES_PASSWORD: etrade_pass
    ports:
      - "5433:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etrade_user -d etrade_auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-demand:
    image: postgres:15-alpine
    container_name: etrade-pg-demand
    environment:
      POSTGRES_DB:       etrade_demand_db
      POSTGRES_USER:     etrade_user
      POSTGRES_PASSWORD: etrade_pass
    ports:
      - "5434:5432"
    volumes:
      - pg_demand_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etrade_user -d etrade_demand_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-document:
    image: postgres:15-alpine
    container_name: etrade-pg-document
    environment:
      POSTGRES_DB:       etrade_document_db
      POSTGRES_USER:     etrade_user
      POSTGRES_PASSWORD: etrade_pass
    ports:
      - "5435:5432"
    volumes:
      - pg_document_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etrade_user -d etrade_document_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:15-alpine
    container_name: etrade-pg-notification
    environment:
      POSTGRES_DB:       etrade_notification_db
      POSTGRES_USER:     etrade_user
      POSTGRES_PASSWORD: etrade_pass
    ports:
      - "5436:5432"
    volumes:
      - pg_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etrade_user -d etrade_notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    image: postgres:15-alpine
    container_name: etrade-pg-keycloak
    environment:
      POSTGRES_DB:       etrade_keycloak_db
      POSTGRES_USER:     etrade_user
      POSTGRES_PASSWORD: etrade_pass
    ports:
      - "5437:5432"
    volumes:
      - pg_keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etrade_user -d etrade_keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════
  # KEYCLOAK
  # ════════════════════════════════════════════════════════════

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: etrade-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB:                   postgres
      KC_DB_URL:               jdbc:postgresql://etrade-pg-keycloak:5432/etrade_keycloak_db
      KC_DB_USERNAME:          etrade_user
      KC_DB_PASSWORD:          etrade_pass
      KEYCLOAK_ADMIN:          admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak-import:/opt/keycloak/data/import:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════
  # MINIO
  # ════════════════════════════════════════════════════════════

  minio:
    image: minio/minio:latest
    container_name: etrade-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minio_admin
      MINIO_ROOT_PASSWORD: minio_pass123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ════════════════════════════════════════════════════════════
  # PGADMIN
  # ════════════════════════════════════════════════════════════

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: etrade-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@etrade.ma
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"

  # ════════════════════════════════════════════════════════════
  # CONFIG SERVER
  # ════════════════════════════════════════════════════════════

  config-server:
    image: etrade-backend-config-server
    container_name: etrade-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ════════════════════════════════════════════════════════════
  # DISCOVERY SERVICE (Eureka)
  # ════════════════════════════════════════════════════════════

  discovery-service:
    image: etrade-backend-discovery-service
    container_name: etrade-discovery-service
    ports:
      - "8761:8761"
    environment:
      CONFIG_SERVER_URL: http://etrade-config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  # ════════════════════════════════════════════════════════════
  # GATEWAY SERVICE
  # ════════════════════════════════════════════════════════════

  gateway-service:
    image: etrade-backend-gateway-service
    container_name: etrade-gateway-service
    ports:
      - "8080:8080"
    volumes:
      - ./gateway-service/target/gateway-service-1.0.0-SNAPSHOT.jar:/app/app.jar
    environment:
      CONFIG_SERVER_URL: http://etrade-config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-pass@etrade-discovery-service:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://etrade-keycloak:8080/realms/etrade
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://etrade-keycloak:8080/realms/etrade/protocol/openid-connect/certs
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════
  # AUTH SERVICE
  # ════════════════════════════════════════════════════════════

  auth-service:
    image: etrade-backend-auth-service
    container_name: etrade-auth-service
    ports:
      - "8081:8081"
    volumes:
      - ./auth-service/target/auth-service-1.0.0-SNAPSHOT.jar:/app/app.jar
    environment:
      # Port
      SERVER_PORT: 8081
      # Spring Cloud Config
      SPRING_CONFIG_IMPORT: "configserver:http://etrade-config-server:8888"
      SPRING_CLOUD_CONFIG_URI: http://etrade-config-server:8888
      CONFIG_SERVER_URL: http://etrade-config-server:8888
      # Eureka — écrase l'URL localhost embarquée dans le JAR
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-pass@etrade-discovery-service:8761/eureka/
      EUREKA_CLIENT_REGISTERWITHEUREKA: "true"
      EUREKA_CLIENT_FETCHREGISTRY: "true"
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      # Base de données
      SPRING_DATASOURCE_URL: jdbc:postgresql://etrade-pg-auth:5432/etrade_auth_db
      SPRING_DATASOURCE_USERNAME: etrade_user
      SPRING_DATASOURCE_PASSWORD: etrade_pass
      # Keycloak — pour appeler Keycloak depuis l'auth-service
      KEYCLOAK_AUTH_SERVER_URL: http://etrade-keycloak:8080
      KEYCLOAK_REALM: etrade
      KEYCLOAK_CLIENT_ID: etrade-backend
      KEYCLOAK_CLIENT_SECRET: W5RiSKMOiHbXX62hpUbR99djSdLZKHDi
      # JWT Resource Server (pour les endpoints protégés de l'auth-service)
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════
  # DEMAND SERVICE
  # ════════════════════════════════════════════════════════════

  demand-service:
    image: etrade-backend-demand-service
    container_name: etrade-demand-service
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URL: http://etrade-config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-pass@etrade-discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://etrade-pg-demand:5432/etrade_demand_db
      SPRING_DATASOURCE_USERNAME: etrade_user
      SPRING_DATASOURCE_PASSWORD: etrade_pass
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://etrade-keycloak:8080/realms/etrade
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://etrade-keycloak:8080/realms/etrade/protocol/openid-connect/certs
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgres-demand:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════
  # DOCUMENT SERVICE
  # ════════════════════════════════════════════════════════════

  document-service:
    image: etrade-backend-document-service
    container_name: etrade-document-service
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://etrade-config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-pass@etrade-discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://etrade-pg-document:5432/etrade_document_db
      SPRING_DATASOURCE_USERNAME: etrade_user
      SPRING_DATASOURCE_PASSWORD: etrade_pass
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://etrade-keycloak:8080/realms/etrade
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://etrade-keycloak:8080/realms/etrade/protocol/openid-connect/certs
      MINIO_URL: http://etrade-minio:9000
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgres-document:
        condition: service_healthy
      minio:
        condition: service_started

  # ════════════════════════════════════════════════════════════
  # NOTIFICATION SERVICE
  # ════════════════════════════════════════════════════════════

  notification-service:
    image: etrade-backend-notification-service
    container_name: etrade-notification-service
    ports:
      - "8084:8084"
    environment:
      CONFIG_SERVER_URL: http://etrade-config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-pass@etrade-discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://etrade-pg-notification:5432/etrade_notification_db
      SPRING_DATASOURCE_USERNAME: etrade_user
      SPRING_DATASOURCE_PASSWORD: etrade_pass
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://etrade-keycloak:8080/realms/etrade
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://etrade-keycloak:8080/realms/etrade/protocol/openid-connect/certs
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgres-notification:
        condition: service_healthy

# ════════════════════════════════════════════════════════════
# VOLUMES
# ════════════════════════════════════════════════════════════

volumes:
  pg_auth_data:
  pg_demand_data:
  pg_document_data:
  pg_notification_data:
  pg_keycloak_data:
  minio_data: