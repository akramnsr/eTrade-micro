services:

  # ── BASES DE DONNÉES ──────────────────────────────────────────

  postgres-auth:
    image: postgres:15-alpine
    container_name: etrade-pg-auth
    environment:
      POSTGRES_DB:       etrade_auth_db
      POSTGRES_USER:     etrade_user
      POSTGRES_PASSWORD: etrade_pass
    ports:
      - "5433:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etrade_user -d etrade_auth_db"]
      interval: 10s
      retries: 5

  postgres-demand:
    image: postgres:15-alpine
    container_name: etrade-pg-demand
    environment:
      POSTGRES_DB:       etrade_demand_db
      POSTGRES_USER:     etrade_user
      POSTGRES_PASSWORD: etrade_pass
    ports:
      - "5434:5432"
    volumes:
      - pg_demand_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etrade_user -d etrade_demand_db"]
      interval: 10s
      retries: 5

  postgres-document:
    image: postgres:15-alpine
    container_name: etrade-pg-document
    environment:
      POSTGRES_DB:       etrade_document_db
      POSTGRES_USER:     etrade_user
      POSTGRES_PASSWORD: etrade_pass
    ports:
      - "5435:5432"
    volumes:
      - pg_document_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etrade_user -d etrade_document_db"]
      interval: 10s
      retries: 5

  postgres-notification:
    image: postgres:15-alpine
    container_name: etrade-pg-notification
    environment:
      POSTGRES_DB:       etrade_notification_db
      POSTGRES_USER:     etrade_user
      POSTGRES_PASSWORD: etrade_pass
    ports:
      - "5436:5432"
    volumes:
      - pg_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etrade_user -d etrade_notification_db"]
      interval: 10s
      retries: 5

  # ── KEYCLOAK ──────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: etrade-keycloak
    command: start-dev
    environment:
      KC_DB:                   dev-mem
      KEYCLOAK_ADMIN:          admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8180:8080"

  # ── MINIO ─────────────────────────────────────────────────────

  minio:
    image: minio/minio:latest
    container_name: etrade-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minio_admin
      MINIO_ROOT_PASSWORD: minio_pass123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ── PGADMIN ───────────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: etrade-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@etrade.ma
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"

volumes:
  pg_auth_data:
  pg_demand_data:
  pg_document_data:
  pg_notification_data:
  minio_data: