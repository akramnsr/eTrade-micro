spring:
  application:
    name: document-service

  datasource:
    url: jdbc:postgresql://localhost:5432/etrade_document_db
    username: etrade_user
    password: n
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/etrade
          jwk-set-uri: http://localhost:8180/realms/etrade/protocol/openid-connect/certs

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8083
services:
  demand-service-url: http://etrade-demand-service:8082
minio:
  url: http://localhost:9000
  access-key: minio_admin
  secret-key: minio_pass123
  bucket-name: etrade-documents

eureka:
  client:
    service-url:
      defaultZone: http://eureka-admin:eureka-pass@localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ma.portnet: DEBUG
    org.springframework.security: INFO
    io.minio: WARN