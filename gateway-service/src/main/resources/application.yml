spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:

        # ── Auth Service ──────────────────────────────────────
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        # ── Demand Service ────────────────────────────────────
        - id: demand-service
          uri: lb://demand-service
          predicates:
            - Path=/api/v1/demands/**, /api/v1/decisions/**

        # ── Document Service ──────────────────────────────────
        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=/api/v1/documents/**

        # ── Notification Service ──────────────────────────────
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS,PATCH
            allowedHeaders: "*"
            allowCredentials: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/etrade
          jwk-set-uri: http://localhost:8180/realms/etrade/protocol/openid-connect/certs

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka-admin:eureka-pass@localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG