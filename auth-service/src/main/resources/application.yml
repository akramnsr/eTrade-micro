spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/etrade_auth_db
    username: etrade_user
    password: n
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/etrade
          jwk-set-uri: http://localhost:8180/realms/etrade/protocol/openid-connect/certs

server:
  port: 8081

keycloak:
  auth-server-url: http://localhost:8180
  realm: etrade
  client-id: etrade-backend
  client-secret: W5RiSKMOiHbXX62hpUbR99djSdLZKHDi

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Ajouter à la fin de chaque application.yml

    eureka:
      client:
        service-url:
          defaultZone: http://eureka-admin:eureka-pass@localhost:8761/eureka/
        register-with-eureka: true
        fetch-registry: true
      instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${server.port}
        lease-renewal-interval-in-seconds: 10
        lease-expiration-duration-in-seconds: 30