spring:
  application:
    name: discovery-service
  security:
    user:
      name: eureka-admin
      password: eureka-pass

server:
  port: 8761

eureka:
  instance:
    hostname: etrade-discovery-service
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://eureka-admin:eureka-pass@etrade-discovery-service:8761/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
