spring:
  application:
    name: demand-service

  datasource:
    url: jdbc:postgresql://etrade-pg-demand:5432/etrade_demand_db
    username: etrade_user
    password: etrade_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://etrade-keycloak:8080/realms/etrade
          jwk-set-uri: http://etrade-keycloak:8080/realms/etrade/protocol/openid-connect/certs

server:
  port: 8082

# URLs inter-services (fallback si Eureka non dispo)
services:
  document-service-url: http://etrade-document-service:8083
  notification-service-url: http://etrade-notification-service:8084

eureka:
  client:
    service-url:
      defaultZone: http://eureka-admin:eureka-pass@etrade-discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ma.portnet: DEBUG
    org.springframework.security: INFO
