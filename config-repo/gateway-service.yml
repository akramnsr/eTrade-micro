spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/**
        - id: demand-service
          uri: lb://demand-service
          predicates:
            - Path=/api/v1/demands/**,/api/v1/decisions/**
        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=/api/v1/documents/**,/api/v1/documents
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://etrade-keycloak:8080/realms/etrade
          jwk-set-uri: http://etrade-keycloak:8080/realms/etrade/protocol/openid-connect/certs

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka-admin:eureka-pass@etrade-discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway,info
app:
  cors:
    allowed-origins: http://localhost:5173