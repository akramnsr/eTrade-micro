spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/etrade_notification_db
    username: etrade_user
    password: n
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/etrade
          jwk-set-uri: http://localhost:8180/realms/etrade/protocol/openid-connect/certs

  # Configuration email SMTP
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:etrade@portnet.ma}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://eureka-admin:eureka-pass@localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Templates email
notification:
  email:
    from: eTrade <etrade@portnet.ma>
    enabled: true  # mettre false en dev si pas de SMTP configuré

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ma.portnet: DEBUG
    org.springframework.mail: DEBUG